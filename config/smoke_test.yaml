run_name: "smoke_test_fast_la_tta"
seed: 42
device: "cuda"
output_dir: ".research/iteration1"

logging:
  enabled: false
  wandb_project: "fast-la-tta-smoke-tests"

training:
  enabled: true
  artifacts_dir: ".research/iteration1/artifacts/smoke_test"
  batch_size: 4
  hyperparameters:
    learning_rate: 0.0003
    ppo_epochs: 1 # Minimal epochs for smoke test
    lambda: 0.05

evaluation:
  enabled: true
  experiments:
    - name: "smoke_test_slack_coupling"
      eval_steps: 20 # Run for very few steps
      model:
        backbone_name: "resnet50.a1_in1k"
      dataset:
        name: "ImageNet-C"
        batch_size: 4
        eta: 1.0
        background_gpu_load: 0.0 # No background load for simplicity
        subset_size: 10 # Use a tiny subset of each corruption
      safety_envelope:
        enabled: true
        epsilon: 0.04
